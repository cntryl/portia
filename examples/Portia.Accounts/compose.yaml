name: portia-accounts-example

services:
  fitz:
    image: ghcr.io/cntryl/fitz@sha256:6d62d9ed9d9fd32186391e6f5944a05a5894e7bd2c7e117288c5ce87acb3035c
    environment:
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_AUTH_REQUIRED: "false"
      FITZ_HTTP_PORT: "4090"
      FITZ_STORAGE_MODE: local
      FITZ_STORAGE_PATH: /tmp/fitz
      FITZ_TCP_ENABLED: "false"
    init: true
    ports:
      - "127.0.0.1:4090:4090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otlp/collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
