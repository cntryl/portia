name: portia-accounts-example

services:
  fitz:
    image: ghcr.io/cntryl/fitz:latest
    environment:
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_AUTH_REQUIRED: "false"
      FITZ_HTTP_PORT: "4090"
      FITZ_STORAGE_MODE: local
      FITZ_STORAGE_PATH: /tmp/fitz
      FITZ_TCP_ENABLED: "false"
    init: true
    ports:
      - "127.0.0.1:4090:4090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777

  otel-collector:
    image: otel/opentelemetry-collector:0.165.0@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otlp/collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
