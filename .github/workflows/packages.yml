name: Packages

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: The immutable package artifact for the caller.
        value: ${{ jobs.pack.outputs.artifact-id }}
      package-version:
        description: The version of the packed packages.
        value: ${{ jobs.pack.outputs.package-version }}

permissions:
  contents: read
  packages: read

jobs:
  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      package-version: ${{ steps.version.outputs.package-version }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read package version
        id: version
        run: |
          version="$(dotnet msbuild src/Portia.AspNetCore/Portia.AspNetCore.csproj -getProperty:PackageVersion -nologo)"
          test -n "$version"
          echo "package-version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack packages
        run: dotnet pack Portia.slnx --configuration Release --output artifacts/packages

      - name: Upload packages
        id: artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ github.run_attempt }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
