name: Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read
      packages: read

  publish:
    name: Publish to GitHub Packages
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      PACKAGE_VERSION: ${{ needs.pack.outputs.package-version }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: artifacts/packages

      - name: Check release tag
        shell: bash
        run: |
          test -n "$PACKAGE_VERSION"
          tag="refs/tags/v$PACKAGE_VERSION"
          existing="$(git ls-remote --refs origin "$tag" | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to a different release commit"
            exit 1
          fi

      - name: Publish packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_AUTH_TOKEN"
          --source "$PACKAGE_SOURCE"
          --skip-duplicate

      - name: Tag release
        run: git push origin "$GITHUB_SHA:refs/tags/v$PACKAGE_VERSION"
