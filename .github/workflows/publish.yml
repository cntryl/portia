name: Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: portia-github-packages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error title=Invalid release ref::Publish must run from refs/heads/main; got $REF"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Read package version
        shell: bash
        run: |
          package_version="$(dotnet msbuild src/Portia.AspNetCore/Portia.AspNetCore.csproj -getProperty:PackageVersion -nologo | sed -n 's/^  PackageVersion = //p')"
          if [[ ! "$package_version" =~ ^0\.1\.[0-9]+$ ]]; then
            echo "::error title=Invalid package version::Expected 0.1.x, got '$package_version'"
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Pack NuGet packages
        run: >-
          dotnet pack Portia.slnx
          --configuration Release
          --output artifacts/packages
          -p:RestoreLockedMode=true
          -p:PackageVersion="$PACKAGE_VERSION"

      - name: Prepare release tag
        id: tag
        shell: bash
        run: |
          tag="v${PACKAGE_VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error title=Tag conflict::$tag points to $tag_commit; expected $GITHUB_SHA"
              exit 1
            fi
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag" "$GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "$NUGET_AUTH_TOKEN" \
            --source "$PACKAGE_SOURCE" \
            --skip-duplicate

      - name: Push tag to origin
        if: steps.tag.outputs.created == 'true'
        run: git push origin "refs/tags/${{ steps.tag.outputs.tag }}"
