name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format Portia.slnx --verify-no-changes

      - name: Build solution
        run: dotnet build Portia.slnx --configuration Release

      - name: Test solution
        run: dotnet test Portia.slnx --configuration Release --no-build
