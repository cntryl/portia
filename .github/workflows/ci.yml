name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A superseded run on the same ref has nothing left to prove, and the Fitz container binds a fixed
# port, so overlapping runs on one runner would contend for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PORTIA_SMOKE_PACKAGE_VERSION: 1.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked packages
        run: dotnet restore Portia.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Portia.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build Portia.slnx --configuration Release --no-restore

      - name: Test solution
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category!=BrokerIntegration&Category!=StorageIntegration"

      - name: Confirm packed consumers
        run: |
          dotnet pack Portia.slnx \
            --configuration Release \
            --no-build \
            --no-restore \
            --output artifacts/packages \
            -p:PackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-aot-packages" dotnet restore \
            smoke/Portia.AspNetCore.NativeAotConsumer/Portia.AspNetCore.NativeAotConsumer.csproj \
            --runtime linux-x64 \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-aot-packages" dotnet publish \
            smoke/Portia.AspNetCore.NativeAotConsumer/Portia.AspNetCore.NativeAotConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION" \
            --output artifacts/native-aot
          artifacts/native-aot/Portia.AspNetCore.NativeAotConsumer
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-aot-packages" dotnet restore \
            smoke/Portia.Mcp.AspNetCore.NativeAotConsumer/Portia.Mcp.AspNetCore.NativeAotConsumer.csproj \
            --runtime linux-x64 \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-aot-packages" dotnet publish \
            smoke/Portia.Mcp.AspNetCore.NativeAotConsumer/Portia.Mcp.AspNetCore.NativeAotConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION" \
            --output artifacts/mcp-native-aot
          artifacts/mcp-native-aot/Portia.Mcp.AspNetCore.NativeAotConsumer
          NUGET_PACKAGES="$RUNNER_TEMP/portia-projection-packages" dotnet restore \
            smoke/Portia.ProjectionStore.PackageConsumer/Portia.ProjectionStore.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-projection-packages" dotnet run \
            --project smoke/Portia.ProjectionStore.PackageConsumer/Portia.ProjectionStore.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-testing-packages" dotnet restore \
            smoke/Portia.Mcp.Testing.PackageConsumer/Portia.Mcp.Testing.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-testing-packages" dotnet run \
            --project smoke/Portia.Mcp.Testing.PackageConsumer/Portia.Mcp.Testing.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-storage-packages" dotnet restore \
            smoke/Portia.Storage.PackageConsumer/Host/Portia.Storage.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-storage-packages" dotnet run \
            --project smoke/Portia.Storage.PackageConsumer/Host/Portia.Storage.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-fitz-lexkey-packages" dotnet restore \
            smoke/Portia.Fitz.LexKey.PackageConsumer/Portia.Fitz.LexKey.PackageConsumer.csproj \
            --runtime linux-x64 \
            -p:PublishAot=true \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-fitz-lexkey-packages" dotnet publish \
            smoke/Portia.Fitz.LexKey.PackageConsumer/Portia.Fitz.LexKey.PackageConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PublishAot=true \
            --output artifacts/fitz-lexkey-native-aot \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          artifacts/fitz-lexkey-native-aot/Portia.Fitz.LexKey.PackageConsumer

      - name: Test S3 storage integration
        env:
          PORTIA_S3_TEST_ENDPOINT: http://127.0.0.1:9000
        run: |
          docker compose up -d sqrzl
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --max-time 2 --output /dev/null \
            http://127.0.0.1:9000/healthz; then
            docker compose logs sqrzl
            exit 1
          fi
          dotnet test Portia.slnx \
            --configuration Release \
            --no-build \
            --filter "Category=StorageIntegration"

      - name: Test full broker integration
        env:
          FITZ_TEST_ENDPOINT: ws://127.0.0.1:4090/ws
        run: |
          docker compose up -d --wait fitz
          dotnet test Portia.slnx \
            --configuration Release \
            --no-build \
            --filter "Category=BrokerIntegration"

      - name: Stop integration services
        if: ${{ always() }}
        run: docker compose down --volumes
