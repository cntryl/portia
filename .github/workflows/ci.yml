name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A superseded run on the same ref has nothing left to prove.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Image digests and settings match compose.yaml, which remains the local-run equivalent.
    services:
      sqrzl:
        image: ghcr.io/sqrzl/sqrzl-emulator@sha256:da1a2a731fe6de71ce8241e3d9fda9ae48dec6015f8b531f4f3129e4ca9969a8
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          SQRZL_BLOBS_PATH: /app/blobs
          SQRZL_LOG_FORMAT: text
          SQRZL_ACCESS_KEY_ID: portia-test
          SQRZL_SECRET_ACCESS_KEY: portia-local-secret
        ports:
          - 127.0.0.1:9000:9000
        options: --init --security-opt no-new-privileges:true

      fitz:
        image: ghcr.io/cntryl/fitz@sha256:5e7d844c52dc24de35f33fb024a3a19b0fa13af7d1fa64edfc8e953371051e1f
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          FITZ_ADMIN_AUTH_MODE: open
          FITZ_AUTH_REQUIRED: "false"
          FITZ_HTTP_PORT: "4090"
          FITZ_STORAGE_MODE: local
          FITZ_STORAGE_PATH: /tmp/fitz
          FITZ_TCP_ENABLED: "false"
        ports:
          - 127.0.0.1:4090:4090
        options: >-
          --init
          --read-only
          --tmpfs /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777
          --security-opt no-new-privileges:true

      cassie:
        image: ghcr.io/cntryl/cassie@sha256:c179afabb7051e19629cfd1ecc6b83fa88bfb4deb6a391060aa1f472f7a0d1de
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CASSIE_STORAGE_MODE: memory
          CASSIE_ROOT_PASSWORD: portia-cassie-test
          CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
        ports:
          - 127.0.0.1:5432:5432
          - 127.0.0.1:8080:8080
        options: --init --security-opt no-new-privileges:true

    env:
      PORTIA_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      FITZ_TEST_ENDPOINT: ws://127.0.0.1:4090/ws
      PORTIA_CASSIE_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=root;Password=portia-cassie-test;SSL Mode=Disable;Timeout=15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify Runtime Async requires an explicit opt-in
        shell: bash
        run: |
          default_features="$(dotnet msbuild src/Portia.Core/Portia.Core.csproj -nologo -getProperty:Features)"
          if [[ "$default_features" == *runtime-async=on* ]]; then
            echo "Runtime Async must remain disabled in the default build." >&2
            exit 1
          fi
          explicit_features="$(dotnet msbuild src/Portia.Core/Portia.Core.csproj -nologo -getProperty:Features -p:UseRuntimeAsync=true)"
          if [[ "$explicit_features" != *runtime-async=on* ]]; then
            echo "UseRuntimeAsync=true did not enable the preview feature." >&2
            exit 1
          fi

      - name: Restore packages
        run: dotnet restore Portia.slnx

      - name: Verify stable external dependencies
        run: dotnet run --project eng/Portia.RepositoryTools/Portia.RepositoryTools.csproj --configuration Release -- verify-stable-dependencies --root .

      - name: Check formatting
        run: dotnet format Portia.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build Portia.slnx --configuration Release --no-restore

      - name: Test solution
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category!=BrokerIntegration&Category!=StorageIntegration&Category!=CassieIntegration&Category!=DurabilityIntegration"

      # Service containers start without a health check, so wait for each endpoint before testing.
      - name: Wait for integration services
        run: |
          for url in http://127.0.0.1:9000/healthz http://127.0.0.1:4090/readyz http://127.0.0.1:8080/readyz; do
            curl --fail --silent --show-error --retry 30 --retry-delay 1 \
              --retry-connrefused --retry-all-errors --max-time 2 --output /dev/null "$url"
          done

      - name: Test S3 storage integration
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category=StorageIntegration"

      - name: Test full broker integration
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category=BrokerIntegration"

      # This lane starts its own isolated, persistent Fitz container on a random port.
      - name: Test operational crash durability with isolated persistent Fitz
        run: >-
          dotnet test test/Portia.Tests/Portia.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=DurabilityIntegration"

      - name: Test Fitz Portia Cassie integration
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category=CassieIntegration"
