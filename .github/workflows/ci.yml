name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A superseded run on the same ref has nothing left to prove, and the Fitz container binds a fixed
# port, so overlapping runs on one runner would contend for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Check formatting
        run: dotnet format Portia.slnx --verify-no-changes

      - name: Build solution
        run: dotnet build Portia.slnx --configuration Release

      - name: Test solution
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category!=BrokerIntegration"

      - name: Test full broker integration
        env:
          FITZ_TEST_ENDPOINT: ws://127.0.0.1:4090/ws
        run: |
          docker compose up -d --wait
          dotnet test Portia.slnx \
            --configuration Release \
            --no-build \
            --filter "Category=BrokerIntegration"

      - name: Stop Fitz server
        if: ${{ always() }}
        run: docker compose down --volumes
