name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A superseded run on the same ref has nothing left to prove.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PORTIA_SMOKE_PACKAGE_VERSION: 1.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Image digests and settings match compose.yaml, which remains the local-run equivalent.
    services:
      sqrzl:
        image: ghcr.io/sqrzl/sqrzl-emulator@sha256:da1a2a731fe6de71ce8241e3d9fda9ae48dec6015f8b531f4f3129e4ca9969a8
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          SQRZL_BLOBS_PATH: /app/blobs
          SQRZL_LOG_FORMAT: text
          SQRZL_ACCESS_KEY_ID: portia-test
          SQRZL_SECRET_ACCESS_KEY: portia-local-secret
        ports:
          - 127.0.0.1:9000:9000
        options: --init --security-opt no-new-privileges:true

      fitz:
        image: ghcr.io/cntryl/fitz@sha256:5e7d844c52dc24de35f33fb024a3a19b0fa13af7d1fa64edfc8e953371051e1f
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          FITZ_ADMIN_AUTH_MODE: open
          FITZ_AUTH_REQUIRED: "false"
          FITZ_HTTP_PORT: "4090"
          FITZ_STORAGE_MODE: local
          FITZ_STORAGE_PATH: /tmp/fitz
          FITZ_TCP_ENABLED: "false"
        ports:
          - 4090/tcp
        options: >-
          --init
          --read-only
          --tmpfs /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777
          --security-opt no-new-privileges:true

      cassie:
        image: ghcr.io/cntryl/cassie@sha256:c179afabb7051e19629cfd1ecc6b83fa88bfb4deb6a391060aa1f472f7a0d1de
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CASSIE_STORAGE_MODE: memory
          CASSIE_ROOT_PASSWORD: portia-cassie-test
          CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
        ports:
          - 127.0.0.1:5432:5432
          - 127.0.0.1:8080:8080
        options: --init --security-opt no-new-privileges:true

    env:
      PORTIA_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      PORTIA_CASSIE_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=root;Password=portia-cassie-test;SSL Mode=Disable;Timeout=15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify Runtime Async requires an explicit opt-in
        shell: bash
        run: |
          default_features="$(dotnet msbuild src/Portia.Core/Portia.Core.csproj -nologo -getProperty:Features)"
          if [[ "$default_features" == *runtime-async=on* ]]; then
            echo "Runtime Async must remain disabled in the default build." >&2
            exit 1
          fi
          explicit_features="$(dotnet msbuild src/Portia.Core/Portia.Core.csproj -nologo -getProperty:Features -p:UseRuntimeAsync=true)"
          if [[ "$explicit_features" != *runtime-async=on* ]]; then
            echo "UseRuntimeAsync=true did not enable the preview feature." >&2
            exit 1
          fi

      - name: Restore packages
        run: dotnet restore Portia.slnx

      - name: Verify stable external dependencies
        run: dotnet run --project eng/Portia.RepositoryTools/Portia.RepositoryTools.csproj --configuration Release -- verify-stable-dependencies --root .

      - name: Check formatting
        run: dotnet format Portia.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build Portia.slnx --configuration Release --no-restore

      - name: Qualify application structure file fixes through the Portia CLI
        run: bash scripts/verify-structure-file-fixes.sh "$RUNNER_TEMP/portia-structure-file-fixes"

      - name: Qualify namespace Fix All with generated constructor references
        run: bash scripts/verify-namespace-fix.sh "$RUNNER_TEMP/portia-namespace-fix" 64

      - name: Qualify actual Prometheus dashboard queries
        run: scripts/qualify-prometheus.sh "$RUNNER_TEMP/portia-prometheus-evidence"

      # These qualification modes exercise correctness only; neither runs timed benchmark jobs.
      - name: Test runtime behavior matrix with JSON reflection disabled
        run: dotnet run --project bench/Portia.Benchmarks/Portia.Benchmarks.csproj --configuration Release --no-build -- --runtime-qualification

      - name: Verify MCP payloads over HTTP and stdio
        run: dotnet run --project bench/Portia.Benchmarks/Portia.Benchmarks.csproj --configuration Release --no-build -- --mcp-protocol-payload-qualification

      - name: Validate M5 MCP lookup supplement report
        run: |
          python3 bench/Portia.Benchmarks/Mcp/summarize_mcp_lookup_supplement.py docs/qualification/mcp-lookup-position-2026-11-12/raw.jsonl
          git diff --exit-code -- docs/qualification/mcp-lookup-position-2026-11-12/README.md

      - name: Test solution
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category!=BrokerIntegration&Category!=StorageIntegration&Category!=CassieIntegration&Category!=DurabilityIntegration"

      - name: Confirm packed consumers
        run: |
          # Package consumer projects use source references by default so standalone dependency
          # discovery can restore them. This property switches them to the freshly packed packages.
          dotnet pack Portia.slnx \
            --configuration Release \
            --no-build \
            --no-restore \
            --output artifacts/packages \
            -p:PackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          dotnet run --project eng/Portia.RepositoryTools/Portia.RepositoryTools.csproj \
            --configuration Release \
            --no-build \
            -- verify-packed-compiler \
            --version "$PORTIA_SMOKE_PACKAGE_VERSION" \
            --packages artifacts/packages
          NUGET_PACKAGES="$RUNNER_TEMP/portia-aot-packages" dotnet restore \
            smoke/Portia.AspNetCore.NativeAotConsumer/Portia.AspNetCore.NativeAotConsumer.csproj \
            --runtime linux-x64 \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-aot-packages" dotnet publish \
            smoke/Portia.AspNetCore.NativeAotConsumer/Portia.AspNetCore.NativeAotConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION" \
            --output artifacts/native-aot
          artifacts/native-aot/Portia.AspNetCore.NativeAotConsumer
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-aot-packages" dotnet restore \
            smoke/Portia.Mcp.AspNetCore.NativeAotConsumer/Portia.Mcp.AspNetCore.NativeAotConsumer.csproj \
            --runtime linux-x64 \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-aot-packages" dotnet publish \
            smoke/Portia.Mcp.AspNetCore.NativeAotConsumer/Portia.Mcp.AspNetCore.NativeAotConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION" \
            --output artifacts/mcp-native-aot
          artifacts/mcp-native-aot/Portia.Mcp.AspNetCore.NativeAotConsumer
          NUGET_PACKAGES="$RUNNER_TEMP/portia-projection-packages" dotnet restore \
            smoke/Portia.ProjectionStore.PackageConsumer/Portia.ProjectionStore.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-projection-packages" dotnet run \
            --project smoke/Portia.ProjectionStore.PackageConsumer/Portia.ProjectionStore.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-cassie-packages" dotnet restore \
            smoke/Portia.Cassie.PackageConsumer/Portia.Cassie.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-cassie-packages" dotnet run \
            --project smoke/Portia.Cassie.PackageConsumer/Portia.Cassie.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-testing-packages" dotnet restore \
            smoke/Portia.Mcp.Testing.PackageConsumer/Portia.Mcp.Testing.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-mcp-testing-packages" dotnet run \
            --project smoke/Portia.Mcp.Testing.PackageConsumer/Portia.Mcp.Testing.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-storage-packages" dotnet restore \
            smoke/Portia.Storage.PackageConsumer/Host/Portia.Storage.PackageConsumer.csproj \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-storage-packages" dotnet run \
            --project smoke/Portia.Storage.PackageConsumer/Host/Portia.Storage.PackageConsumer.csproj \
            --configuration Release \
            --no-restore \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-fitz-lexkey-packages" dotnet restore \
            smoke/Portia.Fitz.LexKey.PackageConsumer/Portia.Fitz.LexKey.PackageConsumer.csproj \
            --runtime linux-x64 \
            -p:PublishAot=true \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          NUGET_PACKAGES="$RUNNER_TEMP/portia-fitz-lexkey-packages" dotnet publish \
            smoke/Portia.Fitz.LexKey.PackageConsumer/Portia.Fitz.LexKey.PackageConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:PublishAot=true \
            --output artifacts/fitz-lexkey-native-aot \
            -p:PortiaSmokePackageVersion="$PORTIA_SMOKE_PACKAGE_VERSION"
          artifacts/fitz-lexkey-native-aot/Portia.Fitz.LexKey.PackageConsumer
          scripts/qualify-account-example.sh "$RUNNER_TEMP/portia-account-otel-evidence"

      # Service containers start without a health check, so wait for each endpoint before testing.
      - name: Wait for integration services
        run: |
          for url in http://127.0.0.1:9000/healthz "http://127.0.0.1:${{ job.services.fitz.ports['4090'] }}/readyz" http://127.0.0.1:8080/readyz; do
            curl --fail --silent --show-error --retry 30 --retry-delay 1 \
              --retry-connrefused --retry-all-errors --max-time 2 --output /dev/null "$url"
          done

      - name: Test S3 storage integration
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category=StorageIntegration"

      - name: Test full broker integration
        env:
          FITZ_TEST_ENDPOINT: ws://127.0.0.1:${{ job.services.fitz.ports['4090'] }}/ws
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category=BrokerIntegration"

      # This lane starts its own isolated, persistent Fitz container on a random port.
      - name: Test operational crash durability with isolated persistent Fitz
        run: >-
          dotnet test test/Portia.Tests/Portia.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=DurabilityIntegration"

      - name: Test Fitz Portia Cassie integration
        env:
          FITZ_TEST_ENDPOINT: ws://127.0.0.1:${{ job.services.fitz.ports['4090'] }}/ws
        run: >-
          dotnet test Portia.slnx
          --configuration Release
          --no-build
          --filter "Category=CassieIntegration"
