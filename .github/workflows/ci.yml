name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A superseded run on the same ref has nothing left to prove.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Integration images and settings match compose.yaml, which remains the local-run equivalent.
    services:
      sqrzl:
        image: ghcr.io/sqrzl/sqrzl-emulator:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          SQRZL_BLOBS_PATH: /app/blobs
          SQRZL_LOG_FORMAT: text
          SQRZL_ACCESS_KEY_ID: portia-test
          SQRZL_SECRET_ACCESS_KEY: portia-local-secret
        ports:
          - 127.0.0.1:9000:9000
        options: --init --security-opt no-new-privileges:true

      fitz:
        image: ghcr.io/cntryl/fitz:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          FITZ_ADMIN_AUTH_MODE: open
          FITZ_AUTH_REQUIRED: "false"
          FITZ_HTTP_PORT: "4090"
          FITZ_STORAGE_MODE: local
          FITZ_STORAGE_PATH: /tmp/fitz
          FITZ_TCP_ENABLED: "false"
        ports:
          - 127.0.0.1:4090:4090
        options: >-
          --init
          --read-only
          --tmpfs /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777
          --security-opt no-new-privileges:true

      cassie:
        image: ghcr.io/cntryl/cassie:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CASSIE_STORAGE_MODE: memory
          CASSIE_ROOT_PASSWORD: portia-cassie-test
          CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
        ports:
          - 127.0.0.1:5432:5432
          - 127.0.0.1:8080:8080
        options: --init --security-opt no-new-privileges:true

    env:
      PORTIA_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      FITZ_TEST_ENDPOINT: ws://127.0.0.1:4090/ws
      PORTIA_CASSIE_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=root;Password=portia-cassie-test;SSL Mode=Disable;Timeout=15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify Runtime Async is enabled
        shell: bash
        run: |
          features="$(dotnet msbuild src/Portia.Core/Portia.Core.csproj -nologo -getProperty:Features)"
          if [[ "$features" != *runtime-async=on* ]]; then
            echo "Portia's net11.0 build must enable Runtime Async." >&2
            exit 1
          fi

      - name: Restore packages
        run: dotnet restore Portia.slnx

      - name: Verify stable external dependencies
        run: dotnet run --project eng/Portia.RepositoryTools/Portia.RepositoryTools.csproj --configuration Release -- verify-stable-dependencies --root .

      - name: Check formatting
        run: dotnet format Portia.slnx --verify-no-changes --no-restore --verbosity diagnostic

      - name: Build solution
        run: dotnet build Portia.slnx --configuration Release --no-restore

      - name: Verify compiler benchmark fixtures
        run: dotnet bench/Portia.CompilerBenchmarks/bin/Release/net11.0/Portia.CompilerBenchmarks.dll verify --size minimal

      - name: Capture and verify Accounts compiler inputs
        shell: bash
        run: |
          dotnet bench/Portia.CompilerBenchmarks/bin/Release/net11.0/Portia.CompilerBenchmarks.dll capture-accounts \
            --root . --output artifacts/compiler/accounts-ci
          PORTIA_COMPILER_ACCOUNTS="$PWD/artifacts/compiler/accounts-ci" \
            dotnet bench/Portia.CompilerBenchmarks/bin/Release/net11.0/Portia.CompilerBenchmarks.dll verify --corpus accounts

      - name: Verify editor benchmark policies
        run: node --test bench/Portia.CompilerBenchmarks/vscode/state.test.cjs

      - name: Test solution
        run: >-
          dotnet test --solution Portia.slnx
          --configuration Release
          --no-build
          --filter-not-trait "Category=BrokerIntegration"
          --filter-not-trait "Category=StorageIntegration"
          --filter-not-trait "Category=CassieIntegration"
          --filter-not-trait "Category=DurabilityIntegration"

      # Service containers start without a health check, so wait for each endpoint before testing.
      - name: Wait for integration services
        run: |
          for url in http://127.0.0.1:9000/healthz http://127.0.0.1:4090/readyz http://127.0.0.1:8080/readyz; do
            curl --fail --silent --show-error --retry 30 --retry-delay 1 \
              --retry-connrefused --retry-all-errors --max-time 2 --output /dev/null "$url"
          done

      - name: Test S3 storage integration
        run: >-
          dotnet test --project test/Portia.Tests/Portia.Tests.csproj
          --configuration Release
          --no-build
          --filter-trait "Category=StorageIntegration"

      - name: Test full broker integration
        run: |
          dotnet test --project test/Portia.Tests/Portia.Tests.csproj \
            --configuration Release --no-build --filter-trait "Category=BrokerIntegration"
          dotnet test --project test/Portia.ConsumerTests/Portia.ConsumerTests.csproj \
            --configuration Release --no-build --filter-trait "Category=BrokerIntegration"

      # This lane starts its own isolated, persistent Fitz container on a random port.
      - name: Test operational crash durability with isolated persistent Fitz
        run: >-
          dotnet test --project test/Portia.Tests/Portia.Tests.csproj
          --configuration Release
          --no-build
          --filter-trait "Category=DurabilityIntegration"

      - name: Test Fitz Portia Cassie integration
        run: >-
          dotnet test --project test/Portia.Tests/Portia.Tests.csproj
          --configuration Release
          --no-build
          --filter-trait "Category=CassieIntegration"

      - name: Pack release packages for HTTP qualification
        run: dotnet pack Portia.slnx --configuration Release --no-build --output artifacts/packages

      - name: Compile packed annotated contracts without ASP.NET Core
        shell: bash
        run: |
          portia_version="$(dotnet msbuild src/Portia.Abstractions/Portia.Abstractions.csproj -getProperty:PackageVersion -nologo)"
          dotnet build smoke/Portia.Json.Contracts/Portia.Json.Contracts.csproj \
            --configuration Release -p:PortiaSmokePackageVersion="$portia_version"

      - name: Test packed HTTP descriptions and strict coverage
        shell: bash
        run: |
          portia_version="$(dotnet msbuild src/Portia.AspNetCore/Portia.AspNetCore.csproj -getProperty:PackageVersion -nologo)"
          dotnet run --project smoke/Portia.AspNetCore.PackageConsumer/Portia.AspNetCore.PackageConsumer.csproj \
            --configuration Release -p:PortiaSmokePackageVersion="$portia_version"

      - name: Publish and test packed NativeAOT HTTP consumer
        shell: bash
        run: |
          portia_version="$(dotnet msbuild src/Portia.AspNetCore/Portia.AspNetCore.csproj -getProperty:PackageVersion -nologo)"
          dotnet publish smoke/Portia.AspNetCore.NativeAotConsumer/Portia.AspNetCore.NativeAotConsumer.csproj \
            --configuration Release --runtime linux-x64 -p:PortiaSmokePackageVersion="$portia_version" \
            --output artifacts/native-http
          ./artifacts/native-http/Portia.AspNetCore.NativeAotConsumer

      - name: Publish and test packed NativeAOT MCP consumer
        shell: bash
        run: |
          portia_version="$(dotnet msbuild src/Portia.AspNetCore/Portia.AspNetCore.csproj -getProperty:PackageVersion -nologo)"
          dotnet publish smoke/Portia.Mcp.AspNetCore.NativeAotConsumer/Portia.Mcp.AspNetCore.NativeAotConsumer.csproj \
            --configuration Release --runtime linux-x64 -p:PortiaSmokePackageVersion="$portia_version" \
            --output artifacts/native-mcp
          ./artifacts/native-mcp/Portia.Mcp.AspNetCore.NativeAotConsumer
