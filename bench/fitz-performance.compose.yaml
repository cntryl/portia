services:
  fitz:
    image: ghcr.io/cntryl/fitz@sha256:5e7d844c52dc24de35f33fb024a3a19b0fa13af7d1fa64edfc8e953371051e1f
    environment:
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_AUTH_REQUIRED: "false"
      FITZ_HTTP_PORT: "4090"
      FITZ_STORAGE_MODE: local
      FITZ_STORAGE_PATH: /data/fitz
      FITZ_TCP_ENABLED: "false"
    init: true
    ports:
      - "127.0.0.1:${FITZ_PERFORMANCE_PORT:-40902}:4090"
    security_opt:
      - no-new-privileges:true
    volumes:
      - fitz-performance-data:/data

volumes:
  fitz-performance-data:
