name: portia-integration

services:
  fitz:
    image: ${FITZ_TEST_IMAGE:-ghcr.io/cntryl/fitz@sha256:d44670dbd6af6dcc84e730215238ba83dc256074218c9f062af6340c825b577d}
    environment:
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_AUTH_REQUIRED: "false"
      FITZ_HTTP_PORT: "4090"
      FITZ_STORAGE_MODE: local
      FITZ_STORAGE_PATH: /tmp/fitz
      FITZ_TCP_ENABLED: "false"
    init: true
    ports:
      - "127.0.0.1:${FITZ_TEST_PORT:-4090}:4090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777
