name: portia-integration

services:
  cassie:
    image: ${CASSIE_TEST_IMAGE:-ghcr.io/cntryl/cassie@sha256:c179afabb7051e19629cfd1ecc6b83fa88bfb4deb6a391060aa1f472f7a0d1de}
    environment:
      CASSIE_STORAGE_MODE: memory
      CASSIE_ROOT_PASSWORD: portia-cassie-test
      CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
    init: true
    ports:
      - "127.0.0.1:${CASSIE_TEST_PORT:-5432}:5432"
      - "127.0.0.1:${CASSIE_TEST_HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  fitz:
    image: ${FITZ_TEST_IMAGE:-ghcr.io/cntryl/fitz@sha256:c2743cd5a3b680c8f77bc6b88762d676b805cad59f93de6c37a73144a872e077}
    environment:
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_AUTH_REQUIRED: "false"
      FITZ_HTTP_PORT: "4090"
      FITZ_STORAGE_MODE: local
      FITZ_STORAGE_PATH: /tmp/fitz
      FITZ_TCP_ENABLED: "false"
    init: true
    ports:
      - "127.0.0.1:${FITZ_TEST_PORT:-4090}:4090"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/fitz:rw,noexec,nosuid,size=64m,mode=1777

  sqrzl:
    image: ghcr.io/sqrzl/sqrzl-emulator@sha256:da1a2a731fe6de71ce8241e3d9fda9ae48dec6015f8b531f4f3129e4ca9969a8
    environment:
      SQRZL_BLOBS_PATH: /app/blobs
      SQRZL_LOG_FORMAT: text
      SQRZL_ACCESS_KEY_ID: portia-test
      SQRZL_SECRET_ACCESS_KEY: portia-local-secret
    init: true
    ports:
      - "127.0.0.1:${SQRZL_TEST_PORT:-9000}:9000"
      - "127.0.0.1:${SQRZL_TEST_UI_PORT:-9001}:9001"
    security_opt:
      - no-new-privileges:true
    volumes:
      - sqrzl-blobs:/app/blobs

volumes:
  sqrzl-blobs:
